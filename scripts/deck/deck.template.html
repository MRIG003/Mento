<title>Mento PM101 Deck</title>

<style>
/* Layout concept: a desk. Slide on a paper card with a sticky-note headline (left), the real app in a phone wireframe (right). */
@font-face{font-family:'Nunito';font-weight:400;font-display:swap;src:url(data:font/woff2;base64,%%NUNITO400%%) format('woff2')}
@font-face{font-family:'Nunito';font-weight:700 800;font-display:swap;src:url(data:font/woff2;base64,%%NUNITO700%%) format('woff2')}
@font-face{font-family:'Caveat';font-weight:600;font-display:swap;src:url(data:font/woff2;base64,%%CAVEAT600%%) format('woff2')}
@font-face{font-family:'Noto Sans Devanagari';font-weight:400;font-display:swap;src:url(data:font/woff2;base64,%%DEVA400%%) format('woff2')}
@font-face{font-family:'Noto Sans Devanagari';font-weight:700;font-display:swap;src:url(data:font/woff2;base64,%%DEVA700%%) format('woff2')}
:root{
  --paper:#F3EBDD; --dot:#D6C9B2; --card:#FFFFFF; --ink:#2B2B2B; --muted:#5A5A52; --line:#E4D9C6;
  --note:#FFE58A; --washi:#F7B2C4; --highlight:#FFEB3B; --primary:#2F3FBF; --primary-d:#24319A;
  --pink:#F8C8D6; --blue:#BFE0F7; --mint:#BDEBD2; --lilac:#D9CCF5; --peach:#FAD3B0;
  --ok:#2E7D4F; --warn:#B26A00; --bad:#C62828; --shadow:0 1px 1px rgb(43 43 43/.08),0 6px 14px -6px rgb(43 43 43/.28);
  --f-ui:'Nunito','Noto Sans Devanagari',ui-sans-serif,system-ui,sans-serif; --f-hand:'Caveat','Nunito',cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper) radial-gradient(var(--dot) 1px,transparent 1px) 0 0/20px 20px;color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;overflow-x:hidden}
button{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.app{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:12px;min-height:100%}
/* top bar */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:20px;letter-spacing:.01em;display:flex;align-items:center;gap:8px;margin-right:4px}
.brand i{width:12px;height:12px;border-radius:3px;background:var(--note);box-shadow:var(--shadow);transform:rotate(-8deg);display:inline-block}
.tabs{display:flex;gap:6px;overflow-x:auto;flex:1 1 380px;padding:2px;scrollbar-width:thin}
.tab{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;min-height:40px;font-weight:700;white-space:nowrap;cursor:pointer}
.tab[aria-current=true]{background:var(--primary);border-color:var(--primary);color:#fff}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:800;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:4px 12px;min-height:40px;display:flex;align-items:center;gap:8px}
.timer.warn{background:var(--note)} .timer.over{background:var(--pink)}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:6px 14px;min-height:40px;font-weight:800;cursor:pointer}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.sm{min-height:34px;padding:2px 12px;font-size:14px}
.btn[aria-pressed=true]{background:var(--note)}
/* stage */
.stage{flex:1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start}
.slide{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:26px 30px 24px;min-height:560px;display:flex;flex-direction:column;gap:16px;position:relative}
.chapter{font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--muted)}
.head{position:relative;align-self:flex-start;max-width:100%;background:var(--note);padding:18px 26px 14px;border-radius:3px;box-shadow:var(--shadow);transform:rotate(-1.2deg);margin-top:12px}
.head::before{content:"";position:absolute;left:50%;top:-12px;width:112px;height:24px;transform:translateX(-50%) rotate(2deg);background:var(--washi);opacity:.88;background-image:repeating-linear-gradient(135deg,rgb(255 255 255/.3) 0 6px,transparent 6px 12px)}
.head h1{margin:0;font-family:var(--f-hand);font-weight:600;font-size:clamp(30px,3.6vw,46px);line-height:1.08;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--muted);font-weight:700;font-size:15px}
.body{display:flex;flex-direction:column;gap:14px;font-size:clamp(16px,1.25vw,19px);min-width:0}
.body p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12.5px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{background:var(--paper);border-radius:14px;padding:14px 16px;border:2px solid var(--line)}
.tile b{display:block}
.stat{font-family:var(--f-hand);font-weight:600;font-size:clamp(40px,4.4vw,60px);line-height:1}
.hl{background:linear-gradient(transparent 12%,var(--highlight) 12% 90%,transparent 90%);padding:0 4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.tag{display:inline-block;padding:3px 12px;border-radius:8px;font-weight:800;box-shadow:var(--shadow);font-size:14px;margin:2px 4px 2px 0}
.t-pink{background:var(--pink)}.t-blue{background:var(--blue)}.t-mint{background:var(--mint)}.t-lilac{background:var(--lilac)}.t-peach{background:var(--peach)}.t-yel{background:var(--note)}
.role{font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.chip{display:inline-flex;align-items:center;border:2px solid var(--ink);border-radius:6px;padding:0 8px;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:var(--card);white-space:nowrap}
.chip.built{border-color:var(--ok);color:var(--ok)}.chip.prev{border-color:var(--primary);color:var(--primary)}.chip.road{border-color:var(--warn);color:var(--warn);border-style:dashed}.chip.test{border-color:var(--muted);color:var(--muted);border-style:dashed}
table{border-collapse:collapse;width:100%;font-size:clamp(13.5px,1.05vw,16px)}
th,td{text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.scroll{overflow-x:auto}
.note-line{background:var(--paper);border-radius:12px;padding:10px 14px;font-size:14.5px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=range]{width:100%;accent-color:var(--primary);min-height:32px}
.bar-track{height:12px;border-radius:99px;background:var(--line);overflow:hidden}.bar-fill{height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
.ok{color:var(--ok)}.warn{color:var(--warn)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:var(--paper);cursor:pointer;min-height:44px}
.chk input{width:22px;height:22px;margin-top:2px;accent-color:var(--primary);flex:none}
.foot{margin-top:auto;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}
/* phone */
.phone-col{width:min(340px,100%);display:flex;flex-direction:column;align-items:center;gap:10px;position:sticky;top:8px}
.phone{--pw:min(300px,calc((100vh - 250px)*.462));width:var(--pw);aspect-ratio:390/844;background:var(--ink);border-radius:36px;padding:9px;box-shadow:0 18px 30px -14px rgb(43 43 43/.55);position:relative}
.phone::before{content:"";position:absolute;top:13px;left:50%;width:30%;height:6px;border-radius:9px;background:#1b1b1b;transform:translateX(-50%);z-index:3}
.phone::after{content:"";position:absolute;bottom:13px;left:50%;width:34%;height:4px;border-radius:9px;background:rgb(43 43 43/.5);transform:translateX(-50%);z-index:3}
.screen{position:relative;width:100%;height:100%;background:var(--paper);border-radius:28px;overflow:hidden}
.screen img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.screen iframe{position:absolute;left:0;top:0;width:390px;height:844px;border:0;transform-origin:0 0;background:var(--paper)}
.screen-tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pill{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:2px 12px;min-height:34px;font-weight:700;font-size:13px;cursor:pointer}
.pill[aria-current=true]{background:var(--note);border-color:var(--ink)}
.cap{font-size:13.5px;text-align:center;color:var(--muted);max-width:300px;min-height:40px}
.live{font-weight:800;font-size:14px;min-height:34px;display:inline-flex;align-items:center;text-decoration:underline;text-underline-offset:3px}
/* interview proof */
.proof{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.polaroid{background:#fff;padding:8px 8px 10px;border-radius:3px;box-shadow:var(--shadow);position:relative;margin:0}
.polaroid:nth-child(odd){transform:rotate(-1.2deg)}.polaroid:nth-child(even){transform:rotate(1deg)}
.polaroid::before{content:"";position:absolute;left:50%;top:-9px;width:56px;height:16px;transform:translateX(-50%) rotate(-2deg);background:var(--washi);opacity:.88}
.polaroid .ph{aspect-ratio:1/1;width:100%;border-radius:2px;background:var(--blue);overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--f-hand);font-size:44px}
.polaroid .ph img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
.polaroid figcaption{margin-top:8px;font-size:13px;line-height:1.35}
.polaroid figcaption b{display:block;font-size:14px}
.polaroid figcaption span{color:var(--muted)}
@media (max-width:640px){.proof{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* notes + nav */
.notes{background:var(--note);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow);transform:rotate(-.4deg);display:none}
.notes.on{display:block}.notes b{font-family:var(--f-hand);font-size:24px;font-weight:600}
.nav{z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;bottom:0;padding:8px 0}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;flex:1}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line);border:0;padding:0;cursor:pointer;min-width:12px}
.dot[aria-current=true]{background:var(--primary);transform:scale(1.25)}
.counter{font-weight:800;font-variant-numeric:tabular-nums;min-width:56px;text-align:center}
/* live room */
.hands{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--paper);border-radius:12px;padding:8px 12px;border:2px solid var(--line)}
.opt.right{border-color:var(--ok)}
.step{display:flex;align-items:center;gap:8px}.step button{width:44px;height:44px;border-radius:12px;border:2px solid var(--ink);background:var(--card);font-weight:800;font-size:20px;cursor:pointer}
.step output{min-width:36px;text-align:center;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.crowd{display:flex;flex-wrap:wrap;gap:6px;min-height:50px}
.kid{width:30px;height:30px;border-radius:8px;box-shadow:var(--shadow);display:inline-block;transition:background .3s}
.kid.got{background:var(--blue)}.kid.help{background:var(--peach);outline:2px solid #E2701F}.kid.fixed{background:var(--blue);outline:3px solid var(--primary)}.kid.empty{background:var(--line);box-shadow:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;font-weight:700}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px}
@media (max-width:1060px){.stage{grid-template-columns:minmax(0,1fr)}.phone-col{position:static;width:100%}.phone{--pw:min(280px,78vw)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.slide{padding:20px 16px;min-height:0}}
@media (max-width:640px){.dots{display:none}.nav{background:var(--paper);justify-content:space-between}.g2,.g3{grid-template-columns:minmax(0,1fr)}.brand span{display:none}.nav .btn{padding:6px 12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body.present-mode .bar .tools .btn.fs{display:none}
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><i aria-hidden="true"></i><span>Mento</span></div>
    <nav class="tabs" id="tabs" aria-label="Product life cycle"></nav>
    <div class="tools">
      <div class="timer" id="timer" role="timer" aria-label="Talk timer"><span id="tclock">0:00</span><span class="tiny muted">of 9:30</span></div>
      <button class="btn sm" id="tstart" type="button">Start timer</button>
      <button class="btn sm" id="treset" type="button">Reset</button>
      <button class="btn sm" id="tnotes" type="button" aria-pressed="false">Notes</button>
    </div>
  </header>
  <main class="stage">
    <section class="slide" id="slide" aria-live="polite"></section>
    <aside class="phone-col" aria-label="The Mento app">
      <div class="phone"><div class="screen" id="screen"></div></div>
      <div class="screen-tabs" id="stabs"></div>
      <div class="cap" id="cap"></div>
      <a class="live" id="livelink" href="https://mento-psi.vercel.app/" target="_blank" rel="noopener">Open the live app ↗</a>
    </aside>
  </main>
  <div class="notes" id="notes" role="region" aria-label="Speaker notes"></div>
  <footer class="nav">
    <button class="btn" id="prev" type="button">‹ Back</button>
    <div class="dots" id="dots"></div>
    <span class="counter" id="count">1 / 1</span>
    <button class="btn primary" id="next" type="button">Next ›</button>
  </footer>
</div>

<script>
(function(){
'use strict';
var APP='https://mento-psi.vercel.app';
var EMBED=/\/present/.test(location.pathname)||/(^|\.)mento-psi\.vercel\.app$/.test(location.hostname);
if(EMBED)document.body.classList.add('present-mode');
var SHOTS=%%SHOTS%%;
var PEOPLE=%%PEOPLE%%;
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function inr(n){return n.toLocaleString('en-IN',{maximumFractionDigits:0})}
function chip(k,t){return '<span class="chip '+k+'">'+t+'</span>'}

/* Phone screens: image key, label, path inside the app (used by /demo?to=) */
var SCR={
 role:{l:'First open',p:'/',c:'Pick a role. EN | हिं is on every screen.'},
 desk:{l:'Desk',p:'/t',c:'The teacher’s desk: tonight’s wrap and the starter checklist.'},
 create:{l:'Create',p:'/t/create',c:'Five suggested questions, tick or add your own. About 30 seconds.'},
 share:{l:'Share',p:'/t/create',c:'One link and a ready WhatsApp message. The teacher taps Send.'},
 results:{l:'Who’s stuck',p:'/t/results',c:'“6 students stuck on Comparing fractions”. Computed from sample answers.'},
 practice:{l:'Practice',p:'/t/results',c:'One tap drafts practice. The teacher checks it before it goes out.'},
 review:{l:'Review',p:'/t/results',c:'Anything the app is unsure about goes to the teacher.'},
 'student-name':{l:'Child link',p:'/h',c:'No app, no account. Children pick their own name.'},
 'student-q':{l:'Question',p:'/h',c:'One question per screen, saved on the phone as they type.'},
 'results-hi':{l:'Hindi',p:'/t/results',c:'Same screen in Hindi. Switch is one tap, nothing is lost.'},
 'student-name-hi':{l:'हिन्दी',p:'/h',c:'The child link in Hindi.'},
 class:{l:'Class',p:'/t/class',c:'Consent per child, class data download, delete.'},
 keep:{l:'What we keep',p:'/privacy',c:'Plain-language privacy page, English and Hindi.'},
 principal:{l:'Principal',p:'/p',c:'Totals only. No child names, no teacher ranking.'},
 locked:{l:'Locked',p:'/p/gaps',c:'Class-level gaps unlock at 3 active teachers or on the School plan.'},
 plan:{l:'Plans',p:'/p/plan',c:'Free vs School plan. Trial and quote are Preview (no payment).'}
};

/* ---------- slides ---------- */
var S=[];
function slide(o){S.push(o)}
var TAB={opening:'Conceive',conceive:'Conceive',plan:'Plan',develop:'Develop',launch:'Launch',refine:'Refine',retire:'Retire',part2:'Part 2'};

slide({id:'cover',tab:'conceive',t:5,chap:'PM101 final presentation',title:'Mento',sub:'Homework that shows who’s stuck, on which concept, and what to do next.',
 screens:['role','results'],
 body:function(){return '<p class="hl" style="align-self:flex-start;font-weight:800">Today we take it through every stage of the product life cycle.</p>'+
 '<div class="grid g2"><div class="tile"><span class="role">Course</span><b>Product Management 101</b></div><div class="tile"><span class="role">School</span><b>Masters’ Union</b></div></div>'+
 '<div class="grid g3"><div class="tile"><b>Part 1</b><span class="muted small">Framework and go-to-market</span></div><div class="tile"><b>Part 2</b><span class="muted small">Free vs paid for schools</span></div><div class="tile"><b>The app</b><span class="muted small">Walk-through, slide by slide</span></div></div>'},
 notes:'“This is Mento. We’ll take it through every stage of the product lifecycle.”'});

slide({id:'hook',tab:'conceive',t:30,chap:'Chapter 1 · Conceive',title:'One homework sheet. Forty different children.',sub:'No time to find out who.',screens:['results','student-name'],
 body:function(){return '<div class="grid g3">'+
 '<div class="tile"><div class="stat">23.4%</div><p>of Class 3 children in rural government schools can read a Class 2 text</p><span class="tiny muted">ASER 2024</span></div>'+
 '<div class="tile"><div class="stat">5–6</div><p>grade levels of ability inside a single class</p><span class="tiny muted">Mindspark study, low-income students, Delhi</span></div>'+
 '<div class="tile"><div class="stat">19.1%</div><p>of a teacher’s school hours go to actual teaching</p><span class="tiny muted">NIEPA study, as reported 2018</span></div></div>'+
 '<p>A teacher sets one sheet for 40 children and has no time to find out <span class="hl">who is stuck, and on what</span>.</p>'},
 notes:'“Three published numbers. Only 23.4% of Class 3 children in rural government schools can read a Class 2 text. In rural private schools it’s 35.5%: better, but still most children can’t. One class can span five to six grade levels. And teachers spend about a fifth of school hours actually teaching. One homework sheet, forty different children, no time to find out who’s stuck.”'});

slide({id:'personas',tab:'conceive',t:25,chap:'Chapter 1 · Conceive',title:'Four people, one problem.',screens:['role','desk','student-name','principal'],
 body:function(){return '<div class="grid g2">'+
 '<div class="tile"><span class="role" style="color:var(--primary)">Teacher · user</span><p>Classes 3–8, affordable private school, 40+ students, checks notebooks in the evening.</p></div>'+
 '<div class="tile"><span class="role" style="color:var(--warn)">Owner or principal · buyer</span><p>Admissions, parent complaints, board results.</p></div>'+
 '<div class="tile"><span class="role">Parent · influencer</span><p>Gets homework on WhatsApp; can’t tell if the child is behind.</p></div>'+
 '<div class="tile"><span class="role">Student · end user</span><p>Uses a parent’s phone in the evening.</p><p class="small"><b>Pain point (proposed):</b> the same worksheet can leave struggling students stuck and advanced students unchallenged.</p></div></div>'+
 '<p class="hl" style="align-self:flex-start;font-weight:800">The user isn’t the buyer. That shapes everything, Part 2 included.</p>'},
 notes:'“Four people. The teacher uses Mento, the owner or principal pays, the parent influences, and the student does the work on a parent’s phone. These are working personas built from desk research and framed as proposals, not interview findings; the next slide sets out how we validate them. The key point: the user isn’t the buyer, which is why Part 2 is free for teachers and paid for by schools.”'});

slide({id:'hyp',tab:'conceive',t:45,chap:'Chapter 1 · Conceive',title:'Hypotheses & Validation Plan',screens:['desk'],
 body:function(){return '<div class="tile"><span class="role" style="color:var(--ok)">Primary research · 4 teacher interviews · WhatsApp video calls, November 2026</span>'+
 '<div class="proof" style="margin-top:12px">'+[['Dr. Khushi Goyal','Teacher, Grades 11–12','LP Savani Academy, Surat'],['Tanistha Khandelwal','Teacher, Grades 9–10','DPS Surat'],['Taniya Bhatia','Teacher, Grades 8–9',''],['Dhruvi Goyal','Professor of Arts, Grades 11–12, and college','']].map(function(q,i){var im=PEOPLE[i];return '<figure class="polaroid"><div class="ph">'+(im?'<img alt="Call screenshot: '+esc(q[0])+'" src="'+im+'">':esc(q[0].replace(/^Dr\. /,'').split(' ').map(function(w){return w[0]}).join('')))+'</div><figcaption><b>'+esc(q[0])+'</b>'+esc(q[1])+(q[2]?'<br><span>'+esc(q[2])+'</span>':'')+'<br><span>WhatsApp video call screenshot</span></figcaption></figure>'}).join('')+'</div></div>'+
 '<p class="small"><span class="role" style="color:var(--primary)">Persona research · proposed, being validated</span> &nbsp;8 personas across 4 segments, built from secondary sources. They shape the questions below and are not interview findings.</p>'+
 '<div class="scroll"><table><thead><tr><th>What we assume</th><th>Why it matters</th><th>How we’d test it</th><th>Evidence that would change our decision</th></tr></thead><tbody>'+
 '<tr><td><b>H1.</b> Teachers can’t see who is stuck, on which concept, until the test.</td><td>It is the core problem Mento solves.</td><td>Teacher interviews: “Walk me through the last homework you set. How did you find out who got it wrong?”</td><td>Teachers already see concept-level gaps today → rethink the core feature.</td></tr>'+
 '<tr><td><b>H2.</b> Checking homework is a heavy evening burden, worst before tests.</td><td>It is the trigger that makes a teacher try a new tool.</td><td>Teacher interviews: “Tell me about the last evening you checked homework. How long? What did you skip?”</td><td>Checking is quick or rare → the trigger is weak.</td></tr>'+
 '<tr><td><b>H3.</b> Owners will pay per student for visible progress.</td><td>It decides the business model.</td><td>Owner and principal interviews: “What software did the school last buy? Why? What made you renew or drop it?”</td><td>No comparable spend tied to parents or admissions → change who pays or how.</td></tr>'+
 '<tr><td><b>H4.</b> Parents will open a no-install link from WhatsApp.</td><td>It is how families are reached without an app.</td><td>Send a sample link to parents of one or two pilot classes; ask non-openers why.</td><td>Few open within 48 hours → add another channel.</td></tr></tbody></table></div>'},
 notes:'The four teacher interviews are real primary research; the quotes and insights from them still have to be added from the team’s notes. The 8 named personas (Sunita, Ramesh, Priya, Farah, Ankit, Neha, Kavita, Rajesh) are hypothesis personas from secondary sources, never to be described as interviews. This slide is our validation plan: the assumptions we make, why each matters, how we would test it, and what evidence would change our decisions. These are proposals, not findings. No interview results or dates are claimed here. H3 matters most because it decides the business model.'});

slide({id:'icp',tab:'conceive',t:30,chap:'Chapter 1 · Conceive',title:'Our ideal customer, and why it’s a painkiller',screens:['desk','create'],
 body:function(){return '<p>A <b>Classes 3–8 teacher in an affordable private school</b> who can’t tell which students are falling behind. Today: homework on WhatsApp, notebooks checked by hand.</p>'+
 '<div class="tile"><span class="role">Job to be done</span><p>“When I’ve set homework for 40 kids and have no time to check it, I want to know <b>who is stuck and on what</b>, so I can help them before the test.”</p></div>'+
 '<div class="grid g3"><div class="tile"><b>Functional</b><span class="muted small">Who is stuck, on which concept.</span></div><div class="tile"><b>Personal</b><span class="muted small">Stop the guilt of kids slipping.</span></div><div class="tile"><b>Social</b><span class="muted small">Look competent to the principal and parents.</span></div></div>'+
 '<div class="tile" style="background:var(--note);border-color:var(--note)"><span class="role">Proposed value</span><p style="margin:0;font-weight:800">Reduce teachers’ nightly checking workload and help schools support students who are falling behind.</p></div>'},
 notes:'Framing: the customer profile, the trigger (a pile of unchecked notebooks before a test, assumption H2) and the painkiller claim are proposals that depend on H1 and H2 holding. We do not claim retention or admissions gains as proven. “Our ideal customer: a Classes 3 to 8 teacher in an affordable private school who can’t tell which students are falling behind. Today it’s WhatsApp and notebooks. The trigger is an assumption, H2: the pile of unchecked notebooks before a test. The job: know who’s stuck, on what, before the test. If H1 and H2 hold, this is a painkiller.”'});

slide({id:'pos',tab:'plan',t:25,chap:'Chapter 2 · Plan',title:'Four red-pill insights',sub:'Persona-derived hypotheses, to be validated.',screens:['results'],
 body:function(){function ins(n,t,blue,red,hot){return '<div class="tile"'+(hot?' style="background:var(--note);border-color:var(--note)"':'')+'><span class="role">'+n+(hot?' · biggest insight':'')+'</span><b>'+t+'</b><p class="small" style="margin-top:4px"><span class="muted">Blue pill:</span> '+blue+'<br><span class="muted">Red pill:</span> '+red+'</p></div>'}
 return '<div class="grid g2">'+
 ins('1','Homework measures parental involvement, not learning.','a correct homework means the child understood.','teachers don’t trust it: parents, siblings and tutors often complete it.',true)+
 ins('2','Teachers have an intelligence problem, not a grading problem.','AI grading will save teachers time.','correcting takes seconds; finding notebooks and spotting repeated mistakes takes hours.')+
 ins('3','Parents want relief from guilt, not homework help.','parents want tools to check homework.','they want to know their child is progressing even when they can’t be there.')+
 ins('4','The biggest competitor is the existing habit.','another homework app improves things.','teachers and parents already juggle diaries, WhatsApp and apps; paper-first and WhatsApp-native wins.')+'</div>'+
 '<div class="row"><span class="tag t-pink">Today: completion → signatures → marks → compliance</span><span class="tag t-mint">Needed: understanding → gaps → timely help → learning</span></div>'+
 '<div class="scroll"><table><thead><tr><th>Positioning: a learning intelligence layer</th><th>Core value</th></tr></thead><tbody><tr><td><b>Teacher</b></td><td>Know who is struggling and why, before the next class.</td></tr><tr><td><b>Parent</b></td><td>Know exactly where your child needs help.</td></tr><tr><td><b>Tutor</b></td><td>Spend less time completing homework and more time teaching.</td></tr></tbody></table></div>'},
 notes:'These four insights come from the eight persona transcripts, which are hypotheses built from secondary research, not live interviews. They are strong hypotheses, not proven market truths; the next step is to validate them through interviews and the survey. Insight 1 is the most powerful: if completion does not indicate learning, the premise of homework management changes. Positioning: not an AI homework checker, but a learning intelligence layer connecting teachers, parents and tutors. Earlier positioning statement, for reference: for Classes 3 to 8 teachers who cannot see who is falling behind until the test, Mento turns every homework into a diagnosis and a practice plan. Moat goals (data, class history, a vernacular question bank) are aspirations, not assets yet.'});

/* ---------- engine ---------- */
var TABS=[['conceive','Conceive'],['plan','Plan'],['develop','Develop'],['launch','Launch'],['refine','Refine'],['retire','Retire'],['part2','Part 2']];
var cur=0,scr=0,notesOn=false;
function idx(){var m=/^#s(\d+)$/.exec(location.hash);var n=m?+m[1]-1:0;return Math.max(0,Math.min(S.length-1,n))}
function tabOf(s){return s.tab}
function buildTabs(){$('tabs').innerHTML=TABS.map(function(t){return '<button class="tab" type="button" data-t="'+t[0]+'">'+t[1]+'</button>'}).join('');
 $('tabs').querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){for(var i=0;i<S.length;i++){if(!S[i].backup&&S[i].tab===b.getAttribute('data-t')){go(i);return}}})})}
function buildDots(){$('dots').innerHTML=S.map(function(s,i){return '<button class="dot" type="button" data-i="'+i+'" aria-label="Slide '+(i+1)+': '+esc(s.title)+'"></button>'}).join('');
 $('dots').querySelectorAll('.dot').forEach(function(b){b.addEventListener('click',function(){go(+b.getAttribute('data-i'))})})}
function renderScreen(){var s=S[cur],keys=s.screens||['role'];if(scr>=keys.length)scr=0;var k=keys[scr],d=SCR[k]||SCR.role;
 var host=$('screen');
 if(EMBED){var frame=host.querySelector('iframe');var to=d.p;var src=(to==='/'?'/':'/demo?to='+encodeURIComponent(to));
  if(!frame){host.innerHTML='<iframe title="Mento app" loading="lazy"></iframe>';frame=host.querySelector('iframe')}
  if(frame.getAttribute('data-p')!==to){frame.setAttribute('data-p',to);frame.src=src}
  fit()}
 else host.innerHTML='<img alt="Mento screen: '+esc(d.l)+'" src="'+(SHOTS[k]||'')+'">';
 $('stabs').innerHTML=keys.map(function(kk,i){return '<button class="pill" type="button" data-s="'+i+'" aria-current="'+(i===scr)+'">'+esc((SCR[kk]||{}).l||kk)+'</button>'}).join('');
 $('stabs').querySelectorAll('.pill').forEach(function(b){b.addEventListener('click',function(){scr=+b.getAttribute('data-s');renderScreen()})});
 $('cap').textContent=d.c;$('livelink').href=APP+(d.p==='/'?'/':'/demo?to='+encodeURIComponent(d.p));
 $('livelink').textContent=EMBED?'Open this screen in its own tab ↗':'Open this screen in the live app ↗'}
function fit(){var host=$('screen'),f=host.querySelector('iframe');if(!f)return;var k=host.clientWidth/390;f.style.transform='scale('+k+')';f.style.height=(host.clientHeight/k)+'px'}
function render(){var s=S[cur];
 $('slide').innerHTML='<div class="chapter">'+esc(s.chap)+'</div><div class="head"><h1>'+esc(s.title)+'</h1>'+(s.sub?'<p>'+esc(s.sub)+'</p>':'')+'</div><div class="body">'+s.body()+'</div>';
 if(s.after)s.after();
 $('count').textContent=(cur+1)+' / '+S.length;
 $('tabs').querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-current',String(b.getAttribute('data-t')===tabOf(s)&&!s.backup))});
 $('dots').querySelectorAll('.dot').forEach(function(b,i){b.setAttribute('aria-current',String(i===cur))});
 $('notes').innerHTML='<b>Speaker notes</b><p>'+esc(s.notes||'')+'</p>';
 $('prev').disabled=cur===0;$('next').disabled=cur===S.length-1;scr=0;renderScreen();window.scrollTo(0,0)}
function go(i){i=Math.max(0,Math.min(S.length-1,i));if(i===cur&&$('slide').innerHTML)return;cur=i;try{history.replaceState(null,'','#s'+(i+1))}catch(e){location.hash='s'+(i+1)}render()}
$('prev').addEventListener('click',function(){go(cur-1)});$('next').addEventListener('click',function(){go(cur+1)});
document.addEventListener('keydown',function(e){var t=e.target;if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)&&t.type!=='range'&&t.type!=='checkbox')return;
 if(e.key==='ArrowRight'||e.key==='PageDown'){go(cur+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(cur-1)}else if(e.key==='n'||e.key==='N'){$('tnotes').click()}});
window.addEventListener('hashchange',function(){go(idx())});window.addEventListener('resize',fit);
$('tnotes').addEventListener('click',function(){notesOn=!notesOn;$('notes').classList.toggle('on',notesOn);$('tnotes').setAttribute('aria-pressed',String(notesOn))});
/* timer */
var tmr=null,secs=0;function tick(){secs++;$('tclock').textContent=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');$('timer').className='timer'+(secs>=600?' over':secs>=570?' warn':'')}
$('tstart').addEventListener('click',function(){if(tmr){clearInterval(tmr);tmr=null;$('tstart').textContent='Start timer'}else{tmr=setInterval(tick,1000);$('tstart').textContent='Pause timer'}});
$('treset').addEventListener('click',function(){clearInterval(tmr);tmr=null;secs=0;$('tclock').textContent='0:00';$('timer').className='timer';$('tstart').textContent='Start timer'});
buildTabs();buildDots();cur=idx();render();
})();
</script>
